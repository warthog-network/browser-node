[build]
  # Package Chromium extension zip into public/downloads/ before Astro copies public → dist.
  command = "npm run extension:package && npm run build"
  publish = "dist"
  # PUBLIC_SNAPSHOT_URL is baked into the client at build (import.meta.env).
  # Points at Official1 static chain.db3 — do not put multi‑GB .db3 on Netlify.
  environment = { NODE_VERSION = "22", PUBLIC_SNAPSHOT_URL = "https://warthognode.duckdns.org/snapshot/chain.db3" }

[functions]
  node_bundler = "esbuild"

# Isolation headers (belt + suspenders with src/middleware.js for SSR HTML).
# Without COOP+COEP: crossOriginIsolated=false, SharedArrayBuffer missing, WASM won't run.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/node/*"
  [headers.values]
    Cross-Origin-Resource-Policy = "same-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

[[headers]]
  for = "/node/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cross-Origin-Resource-Policy = "same-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cross-Origin-Resource-Policy = "same-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

[[headers]]
  for = "/snapshot/*"
  [headers.values]
    Cross-Origin-Resource-Policy = "same-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cache-Control = "public, max-age=3600"

# Old zip name → flattened warthog_node_extension.zip
[[redirects]]
  from = "/downloads/warthog-browser-node-extension.zip"
  to = "/downloads/warthog_node_extension.zip"
  status = 302

# Extension zip download (same-origin; short cache so rebuilds show up)
[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cross-Origin-Resource-Policy = "same-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cache-Control = "public, max-age=300"
